# Modest, shared build box (15 GB, many concurrent sessions): keep the daemon
# heaps small so the daemon + Kotlin daemon + a 1 GB test fork + layoutlib
# screenshot rendering fit comfortably. This app is tiny; 1536m is ample and
# it keeps the pre-push gate from being OOM-killed.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compose Preview screenshot tests (JVM-rendered, no emulator).
android.experimental.enableScreenshotTest=true
