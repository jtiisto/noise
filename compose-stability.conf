// Compose compiler stability configuration.
//
// The playback state that every screen observes lives in non-Compose modules
// (core/model, core/playback) as plain data classes holding a List, which the
// Compose compiler must treat as unstable. That makes HomeScreen and the whole
// catalog non-skippable, so the one-second sleep-timer tick would re-execute
// 16 tiles for hours on the modest phones this app targets. These types are
// immutable by construction (val-only data classes, Mix copies its list), so
// declaring them stable here is truthful and restores skipping.
dev.tapio.hush.core.model.*
dev.tapio.hush.core.playback.PlaybackState
dev.tapio.hush.core.playback.TimerState
dev.tapio.hush.core.playback.PlaybackSettings
